<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Tickets — S.E.M.W.A</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Fraunces:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --blue:#1B4FD8;--blue-l:#EEF3FF;--blue-m:#C3D2FF;
      --teal:#0D9488;--teal-l:#F0FDFA;
      --red:#DC2626;--red-l:#FEF2F2;
      --green:#16A34A;--green-l:#DCFCE7;
      --amber:#D97706;--amber-l:#FFFBEB;
      --slate:#1E293B;--slate2:#334155;--slate3:#64748B;--slate4:#94A3B8;
      --border:#E2E8F0;--bg:#F8FAFC;--white:#fff;
      --shadow:0 1px 3px rgba(0,0,0,.08),0 4px 16px rgba(0,0,0,.06);
      --shadow-lg:0 8px 32px rgba(0,0,0,.12);
    }
    body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--slate)}

    /* NAV */
    .nav-bar{position:sticky;top:0;z-index:200;background:rgba(255,255,255,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:12px 28px;gap:16px}
    .nav-brand{font-family:'Fraunces',serif;font-size:1.2rem;color:var(--blue);letter-spacing:-.02em}
    .nav-brand span{font-style:italic;color:var(--slate3);font-size:.8rem;margin-left:8px;font-family:'Plus Jakarta Sans',sans-serif;font-weight:400}
    .nav-right{display:flex;align-items:center;gap:10px}
    .btn-ghost-sm{padding:8px 16px;background:#fff;color:var(--slate2);border:1.5px solid var(--border);border-radius:8px;font-size:.82rem;font-weight:600;font-family:'Plus Jakarta Sans',sans-serif;cursor:pointer;transition:.2s;text-decoration:none}
    .btn-ghost-sm:hover{border-color:var(--slate3)}

    /* PAGE LAYOUT */
    .page-wrap{max-width:1000px;margin:0 auto;padding:36px 24px}
    .page-header{margin-bottom:28px}
    .page-header h1{font-family:'Fraunces',serif;font-size:2rem;margin-bottom:6px}
    .page-header p{color:var(--slate3);font-size:.9rem}

    /* ONGLETS */
    .tab-row{display:flex;gap:8px;margin-bottom:28px;border-bottom:2px solid var(--border);padding-bottom:0}
    .tab-btn{padding:10px 24px;border:none;background:none;font-size:.88rem;font-weight:600;font-family:'Plus Jakarta Sans',sans-serif;color:var(--slate3);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;transition:.2s}
    .tab-btn.active{color:var(--blue);border-bottom-color:var(--blue)}
    .tab-btn:hover:not(.active){color:var(--slate)}

    /* GRID TICKETS */
    .tickets-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px}
    .ticket-card{background:#fff;border-radius:16px;border:1.5px solid var(--border);overflow:hidden;cursor:pointer;transition:.2s}
    .ticket-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px)}
    .ticket-card-banner{height:80px;display:flex;align-items:center;justify-content:center;font-size:2.2rem;position:relative}
    .ticket-card-body{padding:16px}
    .ticket-card-body h3{font-size:.92rem;font-weight:700;margin-bottom:8px;line-height:1.3}
    .ticket-meta{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
    .ticket-meta span{font-size:.76rem;color:var(--slate3)}
    .ticket-card-footer{display:flex;align-items:center;justify-content:space-between;padding-top:10px;border-top:1px solid var(--border)}
    .status-badge{display:inline-flex;padding:4px 10px;border-radius:99px;font-size:.7rem;font-weight:700;letter-spacing:.03em}

    /* EMPTY STATE */
    .empty-state{text-align:center;padding:64px 0;color:var(--slate3)}
    .empty-state .empty-icon{font-size:3rem;margin-bottom:12px}
    .empty-state p{font-size:.9rem}

    /* TOAST */
    .toast{position:fixed;bottom:28px;right:28px;z-index:999;background:var(--slate);color:#fff;padding:14px 20px;border-radius:12px;font-size:.85rem;font-weight:600;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow-lg);transform:translateY(80px);opacity:0;transition:.3s cubic-bezier(.34,1.56,.64,1)}
    .toast.show{transform:translateY(0);opacity:1}
    .toast-icon{width:20px;height:20px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;font-size:.7rem;flex-shrink:0}

    /* MODAL DÉTAIL TICKET */
    .modal-overlay{display:none;position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:500;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
    .modal-overlay.open{display:flex}
    .modal{background:#fff;border-radius:20px;padding:32px;width:100%;max-width:460px;position:relative;box-shadow:var(--shadow-lg);animation:fadein .2s ease;max-height:90vh;overflow-y:auto}
    @keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
    .modal-close{position:absolute;top:16px;right:16px;width:32px;height:32px;border:none;background:var(--bg);border-radius:8px;cursor:pointer;font-size:1rem;color:var(--slate3);display:flex;align-items:center;justify-content:center}
    .modal-close:hover{background:var(--border)}

    /* MODAL ANNULATION */
    .cancel-overlay{display:none;position:fixed;inset:0;background:rgba(15,23,42,.6);z-index:600;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
    .cancel-overlay.open{display:flex}
    .cancel-modal{background:#fff;border-radius:20px;padding:28px;width:100%;max-width:420px;position:relative;box-shadow:var(--shadow-lg)}

    .btn-primary{width:100%;padding:12px;background:var(--blue);color:#fff;border:none;border-radius:9px;font-size:.9rem;font-weight:700;font-family:'Plus Jakarta Sans',sans-serif;cursor:pointer;transition:.2s}
    .btn-primary:hover{background:#1844c0}
    .btn-danger{width:100%;padding:12px;background:var(--red);color:#fff;border:none;border-radius:9px;font-size:.9rem;font-weight:700;font-family:'Plus Jakarta Sans',sans-serif;cursor:pointer;transition:.2s;margin-top:10px}
    .btn-ghost-full{width:100%;padding:12px;background:#fff;color:var(--slate2);border:1.5px solid var(--border);border-radius:9px;font-size:.9rem;font-weight:600;font-family:'Plus Jakarta Sans',sans-serif;cursor:pointer;transition:.2s;margin-top:8px}
    .btn-ghost-full:hover{border-color:var(--slate3);background:var(--bg)}
  </style>
</head>
<body>

<!-- TOAST -->
<div class="toast" id="toast">
  <div class="toast-icon" id="toast-icon">✓</div>
  <span id="toast-msg">Done</span>
</div>

<!-- MODAL DÉTAIL TICKET -->
<div class="modal-overlay" id="ticket-modal">
  <div class="modal">
    <button class="modal-close" onclick="closeTicketModal()">✕</button>
    <div id="ticket-modal-content"></div>
  </div>
</div>

<!-- MODAL ANNULATION ÉTAPE 1 : confirmation + motif -->
<div class="cancel-overlay" id="cancel-step1">
  <div class="cancel-modal">
    <h3 style="font-family:'Fraunces',serif;font-size:1.2rem;margin-bottom:8px">Cancel this ticket?</h3>
    <p style="font-size:.85rem;color:var(--slate3);margin-bottom:16px" id="cancel-event-name">Are you sure?</p>
    <label style="font-size:.8rem;font-weight:600;color:var(--slate2);display:block;margin-bottom:6px">
      Reason for cancellation <span style="color:var(--slate4)">(optional)</span>
    </label>
    <textarea id="cancel-reason"
              placeholder="Tell us why you're cancelling…"
              style="width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:9px;font-family:'Plus Jakarta Sans',sans-serif;font-size:.85rem;resize:none;height:80px;outline:none;color:var(--slate)"></textarea>
    <button class="btn-danger" id="btn-cancel-step1-continue">Continue →</button>
    <button class="btn-ghost-full" onclick="closeCancelFlow()">Keep my ticket</button>
  </div>
</div>

<!-- MODAL ANNULATION ÉTAPE 2 : double confirmation -->
<div class="cancel-overlay" id="cancel-step2">
  <div class="cancel-modal">
    <div style="font-size:2rem;margin-bottom:12px">⚠️</div>
    <h3 style="font-family:'Fraunces',serif;font-size:1.2rem;margin-bottom:8px;color:var(--red)">This action is permanent</h3>
    <p style="font-size:.85rem;color:var(--slate3);margin-bottom:20px">Do you really want to forfeit your ticket? This cannot be undone.</p>
    <button class="btn-danger" id="btn-cancel-confirm-final">Yes, cancel my ticket</button>
    <button class="btn-ghost-full" onclick="closeCancelFlow()">No, keep it</button>
  </div>
</div>

<!-- NAV -->
<nav class="nav-bar">
  <div class="nav-brand">S.E.M.W.A <span>— My Tickets</span></div>
  <div class="nav-right">
    <a href="/acceuil" class="btn-ghost-sm">← Discover Events</a>
    <button class="btn-ghost-sm" id="btn-logout">Sign out</button>
  </div>
</nav>

<!-- PAGE -->
<div class="page-wrap">
  <div class="page-header">
    <h1>🎫 My Tickets</h1>
    <p>All your event registrations in one place.</p>
  </div>

  <!-- Onglets Upcoming / Past -->
  <div class="tab-row">
    <button class="tab-btn active" data-tab="upcoming">Upcoming Events</button>
    <button class="tab-btn"       data-tab="past">Past Events</button>
  </div>

  <!-- Grille des tickets -->
  <div class="tickets-grid" id="tickets-grid">
    <div class="empty-state" style="grid-column:1/-1">
      <div class="empty-icon">⏳</div>
      <p>Loading your tickets…</p>
    </div>
  </div>
</div>

<script src="/js/my_tickets.js"></script>
</body>
</html>
