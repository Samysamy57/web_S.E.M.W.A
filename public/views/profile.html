<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile — S.E.M.W.A</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Fraunces:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/notifications.css">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --blue:#1B4FD8;--blue-l:#EEF3FF;--blue-m:#C3D2FF;
      --teal:#0D9488;--teal-l:#F0FDFA;
      --amber:#D97706;--amber-l:#FFFBEB;
      --red:#DC2626;--red-l:#FEF2F2;
      --green:#16A34A;--green-l:#DCFCE7;
      --slate:#1E293B;--slate2:#334155;--slate3:#64748B;--slate4:#94A3B8;
      --border:#E2E8F0;--bg:#F8FAFC;--white:#fff;
      --radius:12px;
      --shadow:0 1px 3px rgba(0,0,0,.08),0 4px 16px rgba(0,0,0,.06);
      --shadow-lg:0 8px 32px rgba(0,0,0,.12);
    }
    body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--slate)}

    /* NAV */
    .nav-bar{position:sticky;top:0;z-index:200;background:rgba(255,255,255,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:12px 28px;gap:16px}
    .nav-brand{font-family:'Fraunces',serif;font-size:1.2rem;color:var(--blue);letter-spacing:-.02em}
    .nav-brand span{font-style:italic;color:var(--slate3);font-size:.8rem;margin-left:8px;font-family:'Plus Jakarta Sans',sans-serif;font-weight:400}
    .nav-right{display:flex;align-items:center;gap:10px}
    .btn-ghost-sm{padding:8px 16px;background:#fff;color:var(--slate2);border:1.5px solid var(--border);border-radius:8px;font-size:.82rem;font-weight:600;font-family:'Plus Jakarta Sans',sans-serif;cursor:pointer;transition:.2s;text-decoration:none}
    .btn-ghost-sm:hover{border-color:var(--slate3)}

    /* TOAST */
    .toast{position:fixed;bottom:28px;right:28px;z-index:999;background:var(--slate);color:#fff;padding:14px 20px;border-radius:12px;font-size:.85rem;font-weight:600;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow-lg);transform:translateY(80px);opacity:0;transition:.3s cubic-bezier(.34,1.56,.64,1)}
    .toast.show{transform:translateY(0);opacity:1}
    .toast-icon{width:20px;height:20px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;font-size:.7rem;flex-shrink:0}

    /* ── PAGE 7 — PROFILE ── */
    .profile-wrap{max-width:960px;margin:0 auto;padding:32px 24px}

    /* Bannière de couleur */
    .profile-banner{height:160px;border-radius:20px;background:linear-gradient(135deg,var(--blue),var(--teal));margin-bottom:-48px}

    /* Carte principale avec avatar */
    .profile-card{background:#fff;border-radius:16px;border:1px solid var(--border);padding:24px 28px 24px 24px;display:flex;align-items:flex-start;gap:20px;position:relative;margin-bottom:18px;box-shadow:var(--shadow)}
    .profile-avatar{width:80px;height:80px;border-radius:16px;background:var(--blue);color:#fff;font-size:1.6rem;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:-40px;border:4px solid #fff;box-shadow:var(--shadow)}
    .profile-info{flex:1}
    .profile-name{font-family:'Fraunces',serif;font-size:1.4rem;font-weight:700;margin-bottom:8px}
    .profile-meta{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
    .profile-meta-item{font-size:.8rem;color:var(--slate3)}
    .profile-bio{font-size:.84rem;color:var(--slate2);line-height:1.6}
    .profile-actions{display:flex;gap:10px;flex-shrink:0;margin-top:auto;padding-top:8px}

    /* Boutons */
    .btn-secondary{padding:9px 18px;background:var(--blue-l);color:var(--blue);border:none;border-radius:9px;font-size:.82rem;font-weight:700;font-family:'Plus Jakarta Sans',sans-serif;cursor:pointer;transition:.2s}
    .btn-secondary:hover{background:var(--blue-m)}
    .btn-ghost{padding:9px 16px;background:#fff;color:var(--slate2);border:1.5px solid var(--border);border-radius:9px;font-size:.82rem;font-weight:600;font-family:'Plus Jakarta Sans',sans-serif;cursor:pointer;transition:.2s}
    .btn-ghost:hover{border-color:var(--slate3)}

    /* Statistiques */
    .stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}
    .stat-box{background:#fff;border-radius:14px;border:1px solid var(--border);padding:18px 20px;text-align:center;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
    .stat-box:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px)}
    .stat-num{font-family:'Fraunces',serif;font-size:1.6rem;font-weight:700;color:var(--slate);margin-bottom:4px}
    .stat-lbl{font-size:.75rem;color:var(--slate3);font-weight:500}

    /* Grille des 2 cards du bas */
    .profile-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
    .card{background:#fff;border-radius:16px;border:1px solid var(--border);padding:20px 22px;box-shadow:var(--shadow)}
    .card-title{font-size:.88rem;font-weight:700;color:var(--slate);margin-bottom:14px;display:flex;align-items:center;justify-content:space-between}
    .card-title span{font-size:.76rem;font-weight:600;color:var(--blue);cursor:pointer}
    .card-title span:hover{text-decoration:underline}

    /* Ligne de ticket dans la card */
    .ticket-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);cursor:pointer;transition:.15s}
    .ticket-row:last-of-type{border-bottom:none}
    .ticket-row:hover{opacity:.8}
    .ticket-thumb{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0}
    .status-badge{display:inline-flex;padding:4px 10px;border-radius:99px;font-size:.7rem;font-weight:700;letter-spacing:.03em;white-space:nowrap}

    /* Empty state dans les cards */
    .card-empty{text-align:center;padding:28px 0;color:var(--slate4);font-size:.82rem}

    /* Spinner */
    .spinner{display:inline-block;width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .6s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>

<!-- TOAST -->
<div class="toast" id="toast">
  <div class="toast-icon" id="toast-icon">✓</div>
  <span id="toast-msg">Done</span>
</div>

<!-- NAV -->
<nav class="nav-bar">
  <div class="nav-brand">S.E.M.W.A <span>— My Profile</span></div>
  <div class="nav-right">
    <!-- La cloche et le profil sont injectés par global-notifications.js -->
    <a href="/acceuil" class="btn-ghost-sm">← Discover Events</a>
    <button class="btn-ghost-sm" id="btn-logout">Sign out</button>
  </div>
</nav>

<!-- PAGE PROFIL -->
<div class="profile-wrap">

  <!-- Bannière décorative -->
  <div class="profile-banner"></div>

  <!-- Carte identité -->
  <div class="profile-card">
    <div class="profile-avatar" id="profile-avatar">…</div>
    <div class="profile-info">
      <div class="profile-name" id="profile-name">Chargement…</div>
      <div class="profile-meta" id="profile-meta">
        <div class="profile-meta-item" id="meta-role"></div>
        <div class="profile-meta-item" id="meta-since"></div>
        <div class="profile-meta-item" id="meta-email"></div>
      </div>
      <div class="profile-bio" id="profile-bio"></div>
    </div>
    <div class="profile-actions">
        <button class="btn-secondary" id="btn-edit-profile">Edit profile</button>
      </div>
  </div>

  <!-- Stats (visibles seulement pour les organisateurs) -->
  <div class="stat-row" id="stat-row" style="display:none">
    <div class="stat-box">
      <div class="stat-num" id="stat-events">—</div>
      <div class="stat-lbl">Events organized</div>
    </div>
    <div class="stat-box">
      <div class="stat-num" id="stat-tickets">—</div>
      <div class="stat-lbl">Tickets sold</div>
    </div>
    <div class="stat-box">
      <div class="stat-num" id="stat-revenue">—</div>
      <div class="stat-lbl">Total revenue</div>
    </div>
  </div>

  <!-- Grille des cards -->
  <div class="profile-grid">

    <!-- Card : billets à venir -->
    <div class="card">
      <div class="card-title">
        🎫 My Upcoming Tickets
        <span onclick="window.location.href='/my-tickets'">View all</span>
      </div>
      <div id="upcoming-tickets-list">
        <div class="card-empty"><div class="spinner"></div></div>
      </div>
    </div>

    <!-- Card : informations du compte -->
    <div class="card">
      <div class="card-title">Account Information</div>
      <div style="display:flex;flex-direction:column;gap:12px">
        <div>
          <div style="font-size:.74rem;font-weight:600;color:var(--slate4);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px">Role</div>
          <div style="font-size:.88rem;color:var(--slate2)" id="info-role">—</div>
        </div>
        <div>
          <div style="font-size:.74rem;font-weight:600;color:var(--slate4);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px">Email</div>
          <div style="font-size:.88rem;color:var(--slate2)" id="info-email">—</div>
        </div>
        <div>
          <div style="font-size:.74rem;font-weight:600;color:var(--slate4);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px">Member since</div>
          <div style="font-size:.88rem;color:var(--slate2)" id="info-since">—</div>
        </div>
        <div style="margin-top:8px">
          <button class="btn-ghost" style="width:100%" id="btn-logout-card">Sign out</button>
        </div>
      </div>
    </div>

  </div>
</div>

<!-- Modale édition profil -->
<div class="modal-overlay" id="modal-edit-profile" style="display:none">
  <div class="modal" style="max-width:460px;width:100%">
    <div class="modal-header">
      <div class="modal-title">Edit Profile</div>
      <button class="modal-close" id="btn-close-edit-profile">✕</button>
    </div>
    <div style="display:flex;flex-direction:column;gap:14px;padding:20px 24px 24px">

      <!-- Avatar prévisualisé -->
      <div style="display:flex;align-items:center;gap:14px;margin-bottom:4px">
        <div id="edit-avatar-preview" style="width:56px;height:56px;border-radius:12px;background:var(--blue);color:#fff;font-size:1.2rem;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden"></div>
        <div style="flex:1">
          <label style="font-size:.75rem;font-weight:600;color:var(--slate4);text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:6px">Profile Picture (URL)</label>
          <input type="url" id="edit-avatar-url" placeholder="https://…" class="form-input" style="width:100%">
        </div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div>
          <label style="font-size:.75rem;font-weight:600;color:var(--slate4);text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:6px">First Name *</label>
          <input type="text" id="edit-first-name" class="form-input" style="width:100%">
        </div>
        <div>
          <label style="font-size:.75rem;font-weight:600;color:var(--slate4);text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:6px">Last Name *</label>
          <input type="text" id="edit-last-name" class="form-input" style="width:100%">
        </div>
      </div>

      <div>
        <label style="font-size:.75rem;font-weight:600;color:var(--slate4);text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:6px">Biography</label>
        <textarea id="edit-bio" rows="3" placeholder="Tell us a bit about yourself…" class="form-input" style="width:100%;resize:vertical"></textarea>
      </div>

      <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:4px">
        <button class="btn-ghost" id="btn-cancel-edit-profile">Cancel</button>
        <button class="btn-secondary" id="btn-save-profile">Save changes</button>
      </div>
    </div>
  </div>
</div>

<!-- Styles de la modale (réutilise les variables CSS existantes) -->
<style>
  .modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);backdrop-filter:blur(4px);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px}
  .modal{background:#fff;border-radius:16px;box-shadow:var(--shadow-lg);width:100%;animation:slideUp .25s ease}
  .modal-header{display:flex;align-items:center;justify-content:space-between;padding:18px 24px 0}
  .modal-title{font-size:1rem;font-weight:700;color:var(--slate)}
  .modal-close{background:none;border:none;font-size:1.1rem;cursor:pointer;color:var(--slate3);line-height:1}
  .form-input{padding:9px 12px;border:1.5px solid var(--border);border-radius:9px;font-family:'Plus Jakarta Sans',sans-serif;font-size:.84rem;color:var(--slate);outline:none;transition:.2s}
  .form-input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(27,79,216,.1)}
  @keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
</style>

<script src="/socket.io/socket.io.js"></script>
<script src="/js/global-notifications.js"></script>
<script src="/js/profile.js"></script>
</body>
</html>
